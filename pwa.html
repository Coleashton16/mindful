<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FAF9F6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Mindful MFA</title>

  <!-- Inline PWA Manifest -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"Mindful MFA","short_name":"Mindful MFA","start_url":".","display":"standalone","background_color":"#FAF9F6","theme_color":"#3D6652"}' />

  <!-- Typography: Inter + Newsreader -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            serif: ['Newsreader', 'Georgia', 'serif']
          },
          colors: {
            paper: '#FAF9F6',
            surface: '#FFFFFF',
            stone: '#F2F0EB',
            ink: '#1F2421',
            muted: '#636B66',
            hairline: '#E6E3DC',
            sage: '#3D6652',
            'sage-hover': '#2F5141',
            'sage-light': '#EEF4F0',
            'sage-border': '#CFE0D5',
            'amber-bg': '#FDF6E9',
            'amber-ink': '#8A5A12',
            'amber-border': '#F0D9B1',
            'rose-bg': '#FDF2F2',
            'rose-ink': '#9B2C2C',
            'rose-border': '#F5C6C6'
          }
        }
      }
    };
  </script>
</head>
<body class="bg-paper text-ink font-sans antialiased selection:bg-sage-light selection:text-sage min-h-screen flex flex-col">

  <!-- ======================================================================= -->
  <!-- SIGN-IN GATE (EMAIL & PASSWORD ONLY)                                    -->
  <!-- ======================================================================= -->
  <div id="mfa-auth-gate" class="fixed inset-0 z-50 bg-paper flex items-center justify-center p-4 overflow-y-auto">
    <div class="w-full max-w-sm bg-surface border border-hairline rounded-2xl p-6 sm:p-8 shadow-sm my-auto space-y-6">
      <div class="text-center space-y-2">
        <div class="inline-flex items-center justify-center w-11 h-11 rounded-2xl bg-sage-light text-sage border border-sage-border mx-auto">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
          </svg>
        </div>
        <div>
          <h1 class="font-serif text-3xl text-ink tracking-tight">Mindful MFA</h1>
          <p class="text-xs text-muted mt-1">Sign in to access your verification code</p>
        </div>
      </div>

      <form id="mfa-signin-form" novalidate class="space-y-3.5">
        <div>
          <label for="mfa-email" class="block text-xs font-medium text-muted mb-1">Email</label>
          <input id="mfa-email" type="email" autocomplete="email" placeholder="you@mindful.app" class="w-full px-3.5 py-2.5 rounded-xl bg-paper border border-hairline text-sm text-ink focus:outline-none focus:border-sage/60" />
        </div>

        <div>
          <label for="mfa-password" class="block text-xs font-medium text-muted mb-1">Password</label>
          <input id="mfa-password" type="password" autocomplete="current-password" placeholder="••••••••" class="w-full px-3.5 py-2.5 rounded-xl bg-paper border border-hairline text-sm text-ink focus:outline-none focus:border-sage/60" />
        </div>

        <p id="mfa-auth-error" class="hidden text-xs text-rose-ink bg-rose-bg border border-rose-border rounded-xl px-3.5 py-2.5"></p>

        <button id="mfa-signin-btn" type="submit" class="w-full py-2.5 px-4 rounded-xl bg-sage hover:bg-sage-hover text-white text-sm font-medium transition-colors disabled:opacity-60">
          Sign In
        </button>
      </form>
    </div>
  </div>

  <!-- ======================================================================= -->
  <!-- MINIMAL MINDFUL AUTHENTICATOR SHELL                                     -->
  <!-- ======================================================================= -->
  <div id="mfa-shell" class="hidden flex-1 flex flex-col min-h-screen">
    <!-- Minimal Calm Header -->
    <header class="bg-paper/90 backdrop-blur border-b border-hairline">
      <div class="max-w-sm mx-auto px-4 h-14 flex items-center justify-between gap-3">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-sage"></span>
          <span class="font-serif text-lg tracking-tight text-ink">Mindful MFA</span>
        </div>
        <button id="mfa-signout-btn" type="button" class="px-3 py-1.5 rounded-xl border border-hairline bg-surface hover:bg-stone/60 text-xs font-medium text-muted hover:text-ink transition-colors">
          Sign Out
        </button>
      </div>
    </header>

    <!-- Centered Minimal Verification Card -->
    <main class="flex-1 flex items-center justify-center p-4">
      <div class="w-full max-w-sm bg-surface border border-hairline rounded-3xl p-6 sm:p-8 shadow-sm space-y-6">
        <!-- Account & Subtle Sync Pill -->
        <div class="flex items-center justify-between gap-2">
          <span id="mfa-user-email" class="text-xs text-muted truncate">—</span>
          <span id="mfa-sync-badge" class="shrink-0 inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-stone text-muted text-[11px] font-medium">
            <span id="mfa-sync-dot" class="w-1.5 h-1.5 rounded-full bg-muted"></span>
            <span id="mfa-sync-label">Syncing</span>
          </span>
        </div>

        <!-- 6-Digit Verification Code (Tap to Copy) -->
        <button id="mfa-copy-btn" type="button" title="Tap to copy code" class="w-full py-7 px-4 rounded-2xl bg-paper hover:bg-sage-light/50 border border-hairline hover:border-sage-border transition-colors group text-center">
          <div id="mfa-code-display" class="font-serif text-4xl sm:text-5xl font-medium tracking-[0.18em] text-ink select-all">
            --- ---
          </div>
          <div id="mfa-copy-hint" class="text-[11px] text-muted group-hover:text-sage mt-2.5 transition-colors">
            Tap to copy
          </div>
        </button>

        <!-- 15-Second Calm Progress Bar -->
        <div class="space-y-2">
          <div class="flex items-center justify-between text-xs text-muted">
            <span>New code in</span>
            <span id="mfa-countdown-text" class="font-medium text-ink tabular-nums">15s</span>
          </div>
          <div class="w-full h-1.5 rounded-full bg-stone overflow-hidden">
            <div id="mfa-progress-bar" class="h-full bg-sage rounded-full transition-all duration-100" style="width: 100%"></div>
          </div>
        </div>

        <!-- Sync Error Box (Only shown if Firebase write fails) -->
        <div id="mfa-sync-error" class="hidden text-xs text-rose-ink bg-rose-bg border border-rose-border rounded-xl p-3 leading-relaxed"></div>
      </div>
    </main>
  </div>

  <!-- Toast Notification -->
  <div id="mfa-toast" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-xl bg-ink text-white text-xs font-medium shadow-md max-w-xs text-center"></div>

  <!-- ======================================================================= -->
  <!-- MINDFUL MFA LOGIC (15-SECOND SINGLE-DOC OVERWRITE)                      -->
  <!-- ======================================================================= -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore,
      doc,
      setDoc,
      deleteDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAtSUbIzU45-bf2gS2lbH5iJMeq2c6piLc",
      authDomain: "mindful-cabbd.firebaseapp.com",
      projectId: "mindful-cabbd",
      storageBucket: "mindful-cabbd.firebasestorage.app",
      messagingSenderId: "663102632335",
      appId: "1:663102632335:web:a643dc1001616692c5dbfa",
      measurementId: "G-LVH8053YLS"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const ROTATION_MS = 15000; // 15 seconds

    const state = {
      user: null,
      emailKey: "",
      currentCode: "",
      expiresAtMs: 0,
      rotating: false,
      rotationTimer: null,
      tickTimer: null
    };

    const $ = (id) => document.getElementById(id);

    const els = {
      authGate: $("mfa-auth-gate"),
      signinForm: $("mfa-signin-form"),
      emailInput: $("mfa-email"),
      passwordInput: $("mfa-password"),
      authError: $("mfa-auth-error"),
      signinBtn: $("mfa-signin-btn"),

      shell: $("mfa-shell"),
      signoutBtn: $("mfa-signout-btn"),
      userEmail: $("mfa-user-email"),
      syncBadge: $("mfa-sync-badge"),
      syncDot: $("mfa-sync-dot"),
      syncLabel: $("mfa-sync-label"),

      copyBtn: $("mfa-copy-btn"),
      codeDisplay: $("mfa-code-display"),
      copyHint: $("mfa-copy-hint"),
      countdownText: $("mfa-countdown-text"),
      progressBar: $("mfa-progress-bar"),
      syncError: $("mfa-sync-error"),
      toast: $("mfa-toast")
    };

    function generateSixDigitCode() {
      const array = new Uint32Array(1);
      window.crypto.getRandomValues(array);
      return String(array[0] % 1000000).padStart(6, "0");
    }

    function formatCodeDisplay(code) {
      if (!code || code.length !== 6) return "--- ---";
      return `${code.slice(0, 3)} ${code.slice(3)}`;
    }

    function showToast(msg, duration = 2000) {
      els.toast.textContent = msg;
      els.toast.classList.remove("hidden");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => els.toast.classList.add("hidden"), duration);
    }

    function copyToClipboard(text) {
      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(text).catch(() => {});
        return;
      }
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (_) {}
      document.body.removeChild(ta);
    }

    function setSyncStatus(status, label) {
      els.syncLabel.textContent = label;
      if (status === "synced") {
        els.syncBadge.className = "shrink-0 inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-sage-light text-sage border border-sage-border text-[11px] font-medium";
        els.syncDot.className = "w-1.5 h-1.5 rounded-full bg-sage";
      } else if (status === "error") {
        els.syncBadge.className = "shrink-0 inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-rose-bg text-rose-ink border border-rose-border text-[11px] font-medium";
        els.syncDot.className = "w-1.5 h-1.5 rounded-full bg-rose-ink";
      } else {
        els.syncBadge.className = "shrink-0 inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-stone text-muted text-[11px] font-medium";
        els.syncDot.className = "w-1.5 h-1.5 rounded-full bg-muted animate-pulse";
      }
    }

    function getPrimaryMfaDocRef() {
      return state.user?.uid ? doc(db, "users", state.user.uid, "profile", "mfa_code") : null;
    }

    function getMirrorMfaDocRef() {
      return state.emailKey ? doc(db, "mfa_codes", state.emailKey) : null;
    }

    function updateCountdownVisuals() {
      if (!state.expiresAtMs) {
        els.countdownText.textContent = "15s";
        els.progressBar.style.width = "100%";
        return;
      }
      const remainingMs = Math.max(0, state.expiresAtMs - Date.now());
      const pct = Math.min(100, Math.max(0, (remainingMs / ROTATION_MS) * 100));
      els.countdownText.textContent = `${Math.ceil(remainingMs / 1000)}s`;
      els.progressBar.style.width = `${pct}%`;
      els.progressBar.className = remainingMs <= 3000
        ? "h-full bg-amber-ink rounded-full transition-all duration-100"
        : "h-full bg-sage rounded-full transition-all duration-100";
    }

    async function rotateAndSyncCode() {
      if (!state.user || !state.emailKey || state.rotating) return;
      state.rotating = true;
      els.syncError.classList.add("hidden");
      setSyncStatus("syncing", "Syncing");

      const newCode = generateSixDigitCode();
      const nowMs = Date.now();
      const expiresAtMs = nowMs + ROTATION_MS;

      state.currentCode = newCode;
      state.expiresAtMs = expiresAtMs;

      els.codeDisplay.textContent = formatCodeDisplay(newCode);
      updateCountdownVisuals();

      const payload = {
        email: state.emailKey,
        uid: state.user.uid,
        code: newCode,
        generatedAtMs: nowMs,
        expiresAtMs: expiresAtMs,
        updatedAt: serverTimestamp()
      };

      try {
        let syncedPrimary = false;
        let syncedMirror = false;
        let lastErr = null;

        try {
          const primaryRef = getPrimaryMfaDocRef();
          if (primaryRef) {
            await setDoc(primaryRef, payload);
            syncedPrimary = true;
          }
        } catch (err) {
          lastErr = err;
        }

        try {
          const mirrorRef = getMirrorMfaDocRef();
          if (mirrorRef) {
            await setDoc(mirrorRef, payload);
            syncedMirror = true;
          }
        } catch (err) {
          if (!syncedPrimary) lastErr = err;
        }

        if (!syncedPrimary && !syncedMirror) {
          throw lastErr || new Error("Permission denied by Firestore rules.");
        }

        setSyncStatus("synced", "Active");
      } catch (err) {
        setSyncStatus("error", "Sync Error");
        els.syncError.textContent = `Could not sync code (${err?.code || "error"}): ${err?.message || "Check Firestore rules."}`;
        els.syncError.classList.remove("hidden");
      } finally {
        state.rotating = false;
      }
    }

    async function clearActiveCodeFromFirebase() {
      const refs = [getPrimaryMfaDocRef(), getMirrorMfaDocRef()].filter(Boolean);
      await Promise.all(refs.map(async (ref) => {
        try { await deleteDoc(ref); } catch (_) {}
      }));
    }

    function stopTimers() {
      clearInterval(state.rotationTimer);
      clearInterval(state.tickTimer);
      state.rotationTimer = null;
      state.tickTimer = null;
    }

    function startRotationLoop() {
      stopTimers();
      rotateAndSyncCode();
      state.rotationTimer = setInterval(rotateAndSyncCode, ROTATION_MS);
      state.tickTimer = setInterval(updateCountdownVisuals, 100);
    }

    // Event Listeners
    els.signinForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      els.authError.classList.add("hidden");

      const email = els.emailInput.value.trim();
      const password = els.passwordInput.value;
      if (!email || !password) {
        els.authError.textContent = "Please enter your email and password.";
        els.authError.classList.remove("hidden");
        return;
      }

      els.signinBtn.disabled = true;
      els.signinBtn.textContent = "Signing In…";

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (_) {
        els.authError.textContent = "Invalid email or password.";
        els.authError.classList.remove("hidden");
      } finally {
        els.signinBtn.disabled = false;
        els.signinBtn.textContent = "Sign In";
      }
    });

    els.copyBtn.addEventListener("click", () => {
      if (!state.currentCode) return;
      copyToClipboard(state.currentCode);
      els.copyHint.textContent = "Copied";
      showToast(`Copied ${formatCodeDisplay(state.currentCode)}`);
      setTimeout(() => {
        els.copyHint.textContent = "Tap to copy";
      }, 1800);
    });

    els.signoutBtn.addEventListener("click", async () => {
      stopTimers();
      await clearActiveCodeFromFirebase();
      state.currentCode = "";
      await signOut(auth);
    });

    onAuthStateChanged(auth, (user) => {
      state.user = user;
      if (!user) {
        stopTimers();
        els.shell.classList.add("hidden");
        els.authGate.classList.remove("hidden");
        return;
      }

      state.emailKey = String(user.email || user.uid).trim().toLowerCase();
      els.userEmail.textContent = state.emailKey;

      els.authGate.classList.add("hidden");
      els.shell.classList.remove("hidden");

      startRotationLoop();
    });
  </script>
</body>
</html>
