
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeForge AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #090d16;
    color: #f1f5ff;
    font-family: Arial, sans-serif;
}

header {
    padding: 20px;
    background: #111827;
    border-bottom: 1px solid #293449;
    font-size: 22px;
    font-weight: bold;
}

header span {
    color: #8b7cff;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.settings {
    background: #111827;
    border: 1px solid #293449;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
}

h3 {
    margin-top: 0;
}

label {
    display: block;
    margin: 14px 0 6px;
    color: #aab6cc;
    font-size: 13px;
}

input, textarea {
    width: 100%;
    padding: 12px;
    background: #080d18;
    color: white;
    border: 1px solid #344158;
    border-radius: 8px;
    outline: none;
}

input:focus, textarea:focus {
    border-color: #8b7cff;
}

button {
    background: #8b7cff;
    color: white;
    padding: 12px 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #7463ed;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.chat {
    background: #111827;
    border: 1px solid #293449;
    border-radius: 12px;
    padding: 20px;
}

#messages {
    min-height: 300px;
    max-height: 550px;
    overflow-y: auto;
    margin-bottom: 20px;
}

.message {
    padding: 14px;
    margin-bottom: 12px;
    border-radius: 9px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.6;
}

.user {
    background: #252344;
}

.ai {
    background: #1a2638;
}

pre {
    background: #080d18;
    padding: 12px;
    overflow-x: auto;
    border-radius: 8px;
}

.composer {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.composer textarea {
    min-height: 100px;
    resize: vertical;
}

.status {
    color: #aab6cc;
    font-size: 13px;
    margin-top: 10px;
}

.actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 15px;
}

.secondary {
    background: #293449;
}

</style>
</head>

<body>

<header>
    &lt;/&gt; <span>CodeForge</span> AI
</header>

<div class="container">

    <section class="settings">

        <h3>API Configuration</h3>

        <label>OpenRouter API Key</label>
        <input
            type="password"
            id="apiKey"
            placeholder="sk-or-v1-..."
        >

        <label>Model / Slug</label>
        <input
            type="text"
            id="model"
            value="anthropic/claude-sonnet-4.5"
            placeholder="provider/model-name"
        >

        <label>Maximum Output Tokens (requested)</label>
        <input
            type="number"
            id="maxTokens"
            value="8192"
            min="1"
        >

        <label>Temperature</label>
        <input
            type="number"
            id="temperature"
            value="0.2"
            min="0"
            max="2"
            step="0.1"
        >

        <label>System Instructions</label>
        <textarea id="systemPrompt" rows="5">You are an expert software developer and coding assistant.

Your job is to:
- Create complete applications.
- Write clean, functional code.
- Debug existing code.
- Build websites and tools.
- Explain code when necessary.
- Provide complete files when requested.
- Never unnecessarily shorten code.
- Follow the user's instructions carefully.
- Avoid placeholders when a complete implementation is possible.

Prioritize high-quality, working code.</textarea>

        <div class="actions">
            <button class="secondary" onclick="testConnection()">
                Test API
            </button>

            <button class="secondary" onclick="clearChat()">
                Clear Chat
            </button>
        </div>

    </section>

    <section class="chat">

        <h3>AI Coding Workspace</h3>

        <div id="messages">
            <div class="message ai">
                Welcome to CodeForge!

                What are we building today?
            </div>
        </div>

        <div class="composer">

            <textarea
                id="prompt"
                placeholder="Describe the code or application you want to create..."
            ></textarea>

            <button id="sendButton" onclick="sendMessage()">
                Generate Code →
            </button>

        </div>

        <div class="status" id="status">
            Ready.
        </div>

    </section>

</div>

<script>

let conversation = [];
let busy = false;

const messages = document.getElementById("messages");
const statusText = document.getElementById("status");

function addMessage(text, type) {

    const div = document.createElement("div");

    div.className = "message " + type;

    div.textContent = text;

    messages.appendChild(div);

    messages.scrollTop = messages.scrollHeight;

    return div;
}

function getConfig() {

    const apiKey = document.getElementById("apiKey").value.trim();
    const model = document.getElementById("model").value.trim();
    const maxTokens = Number(document.getElementById("maxTokens").value);
    const temperature = Number(document.getElementById("temperature").value);

    if (!apiKey) throw new Error("Enter your API key.");

    if (!model) throw new Error("Enter a model slug.");

    if (!Number.isInteger(maxTokens) || maxTokens < 1)
        throw new Error("Enter a valid token request.");

    if (!Number.isFinite(temperature) || temperature < 0 || temperature > 2)
        throw new Error("Temperature must be between 0 and 2.");

    return {apiKey, model, maxTokens, temperature};
}

async function sendMessage() {

    if (busy) return;

    const prompt = document.getElementById("prompt").value.trim();

    if (!prompt) return;

    let config;

    try {
        config = getConfig();
    } catch (error) {
        statusText.textContent = error.message;
        return;
    }

    busy = true;

    document.getElementById("sendButton").disabled = true;

    document.getElementById("prompt").value = "";

    addMessage(prompt, "user");

    const aiBubble = addMessage("", "ai");

    statusText.textContent = "Generating...";

    conversation.push({
        role: "user",
        content: prompt
    });

    try {

        const response = await fetch(
            "https://openrouter.ai/api/v1/chat/completions",
            {
                method: "POST",

                headers: {
                    "Authorization": "Bearer " + config.apiKey,
                    "Content-Type": "application/json",
                    "X-Title": "CodeForge AI"
                },

                body: JSON.stringify({

                    model: config.model,

                    messages: [
                        {
                            role: "system",
                            content: document.getElementById("systemPrompt").value
                        },
                        ...conversation
                    ],

                    max_tokens: config.maxTokens,

                    temperature: config.temperature,

                    stream: true

                })
            }
        );

        if (!response.ok) {

            const error = await response.json();

            throw new Error(
                error.error?.message || "OpenRouter request failed."
            );

        }

        const reader = response.body.getReader();

        const decoder = new TextDecoder();

        let buffer = "";
        let fullResponse = "";

        while (true) {

            const {value, done} = await reader.read();

            if (done) break;

            buffer += decoder.decode(value, {stream: true});

            const lines = buffer.split("\n");

            buffer = lines.pop() || "";

            for (const line of lines) {

                if (!line.startsWith("data:")) continue;

                const data = line.slice(5).trim();

                if (data === "[DONE]") continue;

                try {

                    const parsed = JSON.parse(data);

                    const content =
                        parsed.choices?.[0]?.delta?.content;

                    if (typeof content === "string") {

                        fullResponse += content;

                        aiBubble.textContent = fullResponse;

                        messages.scrollTop = messages.scrollHeight;

                    }

                } catch {}

            }

        }

        if (!fullResponse) {
            throw new Error("The model returned an empty response.");
        }

        conversation.push({
            role: "assistant",
            content: fullResponse
        });

        statusText.textContent = "Generation complete.";

    } catch (error) {

        statusText.textContent = "Error: " + error.message;

        aiBubble.textContent = "Error: " + error.message;

        conversation.pop();

    } finally {

        busy = false;

        document.getElementById("sendButton").disabled = false;

    }

}

async function testConnection() {

    if (busy) return;

    try {

        const config = getConfig();

        statusText.textContent = "Testing connection...";

        const response = await fetch(
            "https://openrouter.ai/api/v1/chat/completions",
            {
                method: "POST",

                headers: {
                    "Authorization": "Bearer " + config.apiKey,
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    model: config.model,

                    messages: [
                        {
                            role: "user",
                            content: "Reply with: Connection successful!"
                        }
                    ],

                    max_tokens: 30

                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error?.message || "Connection failed.");
        }

        statusText.textContent = "API connection successful!";

    } catch (error) {

        statusText.textContent = "Error: " + error.message;

    }

}

function clearChat() {

    conversation = [];

    messages.innerHTML = "";

    addMessage("Fresh chat. What are we building?", "ai");

    statusText.textContent = "Chat cleared.";

}

</script>

</body>
</html>
